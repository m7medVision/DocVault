name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Type check
        working-directory: mobile
        run: npm run type-check

      - name: Test
        working-directory: mobile
        run: npm test

  # Mobile apps are built via EAS Build, not Docker
  # Add EAS build step here when ready for deployment
