# NOTE: App services (backend, processing, web, mobile) run natively on host
#       This file only provides infrastructure services

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docvault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docvault}
      POSTGRES_USER: ${POSTGRES_USER:-docvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docvault_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docvault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docvault-dev

  redis:
    image: redis:7-alpine
    container_name: docvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docvault-dev

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: docvault-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/docvault}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docvault}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - docvault-dev

  minio:
    image: minio/minio:latest
    container_name: docvault-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_CI_QUIET: "true"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - docvault-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio-init:
    image: minio/mc:latest
    container_name: docvault-mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...';
        sleep 5;
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} || true;
        mc mb local/docvault-documents --ignore-existing || true;
        mc mb local/docvault-processed --ignore-existing || true;
        mc mb local/docvault-translations --ignore-existing || true;
        mc anonymous set none local/docvault-documents || true;
        mc anonymous set none local/docvault-processed || true;
        mc anonymous set none local/docvault-translations || true;
        echo 'MinIO buckets initialized';
        exit 0
      "
    networks:
      - docvault-dev

  grafana:
    image: grafana/grafana:latest
    container_name: docvault-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - docvault-dev

  tempo:
    image: grafana/tempo:2.10.1
    container_name: docvault-tempo
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./ops/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - docvault-dev

  loki:
    image: grafana/loki:latest
    container_name: docvault-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./ops/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - docvault-dev

  prometheus:
    image: prom/prometheus:latest
    container_name: docvault-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - docvault-dev

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: docvault-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - tempo
    networks:
      - docvault-dev

  promtail:
    image: grafana/promtail:latest
    container_name: docvault-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./ops/observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - docvault-dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  docvault-dev:
    driver: bridge
